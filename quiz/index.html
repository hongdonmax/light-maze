<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입장 퀴즈 — 빛의 미로</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0d1f; --ink:#f3f4ff; --muted:#a9b0d6; --accent:#ffd36b; --accent2:#ff7bd5; --cyan:#7fd1ff; --ok:#4ade80; --bad:#f87171; --line:rgba(255,255,255,.14); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Noto Sans KR',system-ui,sans-serif; color:var(--ink); background:#0a0d1f url('../assets/world2.jpg') center/cover fixed; }
  body::before { content:''; position:fixed; inset:0; background:linear-gradient(180deg, rgba(8,10,30,.8), rgba(8,10,30,.92)); z-index:-1; }
  .wrap { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  header { text-align:center; margin-bottom:18px; }
  .kicker { color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:13px; }
  h1 { font-family:'Jua',sans-serif; font-size:clamp(34px,7vw,54px); margin:4px 0 2px; }
  h1 span { background:linear-gradient(180deg,#fff3b0,#ffd36b 50%,#ff7bd5); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:14px; }
  .card { background:rgba(18,22,52,.85); border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5); backdrop-filter:blur(8px); }
  .progress { display:flex; gap:5px; margin-bottom:16px; }
  .progress i { flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,.12); }
  .progress i.ok { background:var(--ok); } .progress i.bad { background:var(--bad); } .progress i.cur { background:var(--accent); }
  .qnum { color:var(--accent); font-weight:900; font-size:13px; letter-spacing:1px; }
  .q { font-size:clamp(18px,3vw,22px); font-weight:800; line-height:1.5; margin:6px 0 16px; }
  .opts { display:grid; gap:10px; }
  .opt { text-align:left; background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--ink); border-radius:14px; padding:14px 16px; font-size:16px; font-weight:700; cursor:pointer; display:flex; gap:12px; align-items:center; transition:.15s; font-family:inherit; }
  .opt:hover { background:rgba(255,211,107,.18); transform:translateX(4px); }
  .opt .n { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.12); display:grid; place-items:center; font-size:14px; flex:none; }
  .opt.correct { background:rgba(74,222,128,.22); border-color:var(--ok); } .opt.wrong { background:rgba(248,113,113,.2); border-color:var(--bad); }
  .opt:disabled { cursor:default; }
  .explain { margin-top:14px; padding:12px 14px; border-radius:12px; background:rgba(127,209,255,.1); border-left:3px solid var(--cyan); font-size:14px; line-height:1.6; display:none; }
  .explain.show { display:block; }
  .btn { border:none; border-radius:14px; padding:13px 22px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; background:rgba(255,255,255,.12); color:var(--ink); }
  .btn.primary { background:linear-gradient(135deg,#ffd36b,#ff9a5c); color:#2a1a05; box-shadow:0 6px 24px rgba(255,180,80,.35); }
  .btn.big { font-size:20px; padding:16px 30px; font-family:'Jua',sans-serif; letter-spacing:1px; }
  .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
  .result { text-align:center; }
  .score { font-family:'Jua',sans-serif; font-size:64px; line-height:1; margin:10px 0; }
  .score small { font-size:22px; color:var(--muted); }
  .badge { display:inline-block; padding:8px 16px; border-radius:999px; font-weight:900; margin:8px 0 14px; }
  .badge.pass { background:rgba(74,222,128,.2); color:var(--ok); border:1px solid var(--ok); }
  .badge.fail { background:rgba(248,113,113,.2); color:var(--bad); border:1px solid var(--bad); }
  .review { text-align:left; margin-top:16px; display:grid; gap:8px; }
  .review div { font-size:13px; padding:8px 12px; border-radius:10px; background:rgba(255,255,255,.06); }
  .review .x { color:var(--bad); } .review .o { color:var(--ok); }
  .lumi { position:fixed; right:-10px; bottom:-10px; height:38vh; pointer-events:none; opacity:.9; filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
  @media (max-width:700px) { .lumi { display:none; } }
  .foot { text-align:center; color:rgba(255,255,255,.5); font-size:12px; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">5학년 1학기 과학 · 2. 빛의 성질 · 입장 퀴즈</div>
    <h1>💎 <span>빛의 미로</span> 입장 퀴즈</h1>
    <div class="sub">10문제 중 <b style="color:var(--accent)">7문제 이상</b> 맞히면 게임 입장 문이 열려요!</div>
  </header>
  <div class="card" id="card"></div>
  <div class="foot">성취기준 [6과02-01] [6과02-02] [6과02-03] · 명진초 최일훈</div>
</div>
<img class="lumi" src="../assets/lumi.png" alt="">
<script>
const POOL = [
  { q:'캄캄한 어둠상자 속 물체를 보려면 꼭 필요한 것은 무엇일까요?', o:['빛','소리','바람','거울'], a:0, e:'물체를 보기 위해서는 빛이 있어야 해요. 손전등을 끄면 어둠상자 속 물체가 보이지 않아요.' },
  { q:'태양이나 전등처럼 스스로 빛을 내는 물체를 무엇이라고 할까요?', o:['거울','광원','렌즈','그림자'], a:1, e:'스스로 빛을 내는 물체를 광원이라고 해요. 광원의 빛이 물체에 반사되어 눈에 들어오면 물체가 보여요.' },
  { q:'어둠상자 실험에서 윗면의 손전등을 끄면 어떻게 될까요?', o:['물체가 더 잘 보인다','물체가 보이지 않는다','물체의 색이 바뀐다','물체가 커 보인다'], a:1, e:'빛이 없으면 물체가 보이지 않아요. 눈에서 빛이 나가는 것이 아니라, 빛이 물체에 반사되어 눈에 들어와야 보여요.' },
  { q:'빛이 곧게 나아가는 성질을 무엇이라고 할까요?', o:['빛의 반사','빛의 굴절','빛의 직진','빛의 흡수'], a:2, e:'레이저 지시기의 빛은 곧게 나아가요. 이것을 빛의 직진이라고 해요.' },
  { q:'그림자의 모양이 물체의 모양과 비슷한 까닭은?', o:['빛이 직진하기 때문','빛이 굴절하기 때문','물체가 투명하기 때문','빛이 색을 바꾸기 때문'], a:0, e:'빛이 직진하다가 불투명한 물체에 막히면 물체 뒤에 물체 모양의 그림자가 생겨요.' },
  { q:'빛이 거울에 부딪쳐 나아가는 방향이 바뀌는 성질은?', o:['빛의 직진','빛의 반사','빛의 굴절','빛의 분산'], a:1, e:'빛이 물체(거울)에 부딪쳐 방향이 바뀌는 성질을 빛의 반사라고 해요. 평면거울은 빛의 반사를 이용한 도구예요.' },
  { q:'빛이 공기에서 물로 비스듬히 들어갈 때 일어나는 현상은?', o:['경계에서 꺾인다','빛이 사라진다','그대로 직진한다','색이 초록으로 바뀐다'], a:0, e:'서로 다른 물질의 경계에서 빛이 꺾이는 성질을 빛의 굴절이라고 해요.' },
  { q:'빛이 공기와 물의 경계에 수직으로 들어가면 어떻게 될까요?', o:['크게 꺾인다','꺾이지 않고 그대로 나아간다','반사되어 되돌아온다','빛이 사라진다'], a:1, e:'수직으로 들어가는 빛은 꺾이지 않아요. 비스듬히 들어갈 때만 꺾여요.' },
  { q:'작은 글씨를 크게 볼 때 사용하는 렌즈는?', o:['오목 렌즈','볼록 렌즈','평면거울','어둠상자'], a:1, e:'가운데가 두꺼운 볼록 렌즈는 빛을 모아 물체를 실제보다 크게 보이게 해요. 돋보기가 볼록 렌즈예요.' },
  { q:'거울 두 개를 이용해 벽 너머를 볼 수 있게 만든 장치는?', o:['돋보기','현미경','잠망경','사진기'], a:2, e:'잠망경은 거울 두 개에서 빛이 두 번 반사되는 원리로 보이지 않는 곳을 볼 수 있어요.' },
  { q:'다음 중 빛의 반사를 이용한 도구는?', o:['돋보기','자동차 뒷거울','안경','현미경'], a:1, e:'거울은 빛의 반사를 이용해요. 돋보기·안경·현미경은 렌즈(빛의 굴절)를 이용해요.' },
  { q:'오목 렌즈를 통과한 빛은 어떻게 될까요?', o:['한 점으로 모인다','바깥으로 퍼진다','그 자리에 멈춘다','색이 변한다'], a:1, e:'가운데가 얇은 오목 렌즈는 빛을 퍼뜨려요. 물체가 작게, 더 넓은 범위가 보여요.' },
  { q:'생활 속에서 빛의 직진을 볼 수 있는 예는?', o:['나뭇잎 사이로 곧게 비치는 햇빛','거울에 비친 내 모습','돋보기로 크게 본 나비','물속 막대가 꺾여 보이는 것'], a:0, e:'나뭇잎 사이로 곧게 내려오는 햇빛은 빛의 직진, 거울은 반사, 돋보기와 물속 막대는 굴절이에요.' },
];
const PASS = 7, N = 10;
let qs = [], idx = 0, score = 0, log = [];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function start(){ qs = shuffle([...POOL]).slice(0,N); idx=0; score=0; log=[]; render(); }
function render(){
  const card=document.getElementById('card');
  if(idx>=N){ return result(); }
  const q=qs[idx];
  card.innerHTML = `<div class="progress">${qs.map((_,i)=>`<i class="${log[i]===undefined?(i===idx?'cur':''):(log[i]?'ok':'bad')}"></i>`).join('')}</div>
    <div class="qnum">Q${idx+1} / ${N}</div><div class="q">${q.q}</div>
    <div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span>${t}</button>`).join('')}</div>
    <div class="explain" id="explain"></div>
    <div class="actions"><button class="btn primary" id="next" style="display:none">다음 문제 ▶</button></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(parseInt(b.dataset.i))));
  document.getElementById('next').addEventListener('click',()=>{ idx++; render(); });
}
function answer(i){
  const q=qs[idx]; const ok=i===q.a; log[idx]=ok; if(ok) score++;
  document.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true; if(k===q.a) b.classList.add('correct'); else if(k===i) b.classList.add('wrong'); });
  const ex=document.getElementById('explain'); ex.className='explain show'; ex.innerHTML=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+q.e;
  document.getElementById('next').style.display=''; document.getElementById('next').textContent = idx===N-1?'결과 보기 ▶':'다음 문제 ▶';
}
function result(){
  const pass = score>=PASS; try{ if(pass){ const k='lightmaze.progress.v1'; const p=JSON.parse(localStorage.getItem(k)||'{}'); p.quiz=true; p.stars=p.stars||{}; p.concepts=p.concepts||[]; localStorage.setItem(k,JSON.stringify(p)); } }catch(e){}
  document.getElementById('card').innerHTML = `<div class="result">
    <div class="qnum">결과</div>
    <div class="score">${score}<small> / ${N}</small></div>
    <div class="badge ${pass?'pass':'fail'}">${pass?'🎉 통과! 빛의 미로 입장 가능':'😢 아쉬워요! 7문제 이상 맞혀야 해요'}</div>
    <p style="color:var(--muted);font-size:14px;margin:0">${pass?'빛의 성질을 잘 알고 있군요. 이제 레이저 탐험대에 합류하세요!':'틀린 문제의 설명을 다시 읽고 도전해 보세요.'}</p>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="retry">↺ 다시 풀기</button>
      ${pass?'<a class="btn primary big" href="../index.html?pass=1">💎 게임 입장하기 ▶</a>':''}
    </div>
    <div class="review">${qs.map((q,i)=>`<div class="${log[i]?'o':'x'}">${log[i]?'⭕':'❌'} Q${i+1}. ${q.q} <b>→ ${q.o[q.a]}</b></div>`).join('')}</div>
  </div>`;
  document.getElementById('retry').addEventListener('click', start);
}
start();
</script>
</body>
</html>
